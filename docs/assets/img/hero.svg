    <circle cx="110" cy="58" r="60" fill="url(#fire)"/>
    <path d="M0 62 L48 0 L96 62Z" fill="#1a0e1c"/>
    <path d="M48 0 L60 62 L36 62Z" fill="#3a1d33"/>
    <path d="M100 62 L110 40 L120 62Z" fill="#ff9a3c"/><path d="M105 62 L111 48 L116 62Z" fill="#ffe7a3"/>
