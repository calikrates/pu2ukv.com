<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset=".38" stop-color="#5a2f5e"/>
      <stop offset=".62" stop-color="#c8553d"/>
      <stop offset=".80" stop-color="#f28f3b"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".45" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fire" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff7b39" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a3a"/>
      <stop offset="1" stop-color="#4a2c2a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="640" fill="url(#sky)"/>

  <!-- estrelas -->
  <g fill="#fff" opacity=".75">
    <circle cx="90" cy="40" r="1.4"/><circle cx="210" cy="90" r="1"/><circle cx="330" cy="30" r="1.6"/>
    <circle cx="470" cy="70" r="1"/><circle cx="560" cy="25" r="1.2"/><circle cx="700" cy="55" r="1"/>
    <circle cx="820" cy="20" r="1.5"/><circle cx="1000" cy="45" r="1"/><circle cx="1130" cy="22" r="1.3"/>
    <circle cx="1270" cy="60" r="1"/><circle cx="1390" cy="30" r="1.6"/><circle cx="1520" cy="75" r="1.1"/>
    <circle cx="150" cy="130" r=".9"/><circle cx="640" cy="120" r=".9"/><circle cx="1450" cy="140" r=".9"/>
  </g>

  <!-- sol -->
  <circle cx="1060" cy="430" r="190" fill="url(#sun)"/>
  <circle cx="1060" cy="430" r="62" fill="#ffe7a3" opacity=".95"/>

  <!-- serras ao fundo -->
  <path d="M0 410 L120 360 L230 395 L360 330 L480 380 L600 340 L720 395 L860 350 L980 400 L1120 345 L1260 390 L1400 340 L1600 385 V640 H0Z" fill="#a8484a" opacity=".55"/>
  <path d="M0 450 L150 400 L300 440 L420 395 L560 445 L700 410 L860 455 L1000 415 L1150 460 L1300 410 L1450 450 L1600 420 V640 H0Z" fill="#6e2f45" opacity=".85"/>

  <!-- morro da torre -->
  <path d="M0 520 C180 470 320 455 460 470 C600 485 700 520 820 520 C980 520 1100 480 1260 485 C1400 490 1500 515 1600 505 V640 H0Z" fill="#3a1d33"/>

  <!-- torre treliçada -->
  <g transform="translate(1110 30)">
  <g stroke="#1a0e1c" stroke-width="3" fill="none">
    <path d="M300 470 L330 210 L360 470"/>
    <path d="M305 430 L355 390 M355 430 L305 390 M309 380 L351 340 M351 380 L309 340 M313 330 L347 290 M347 330 L313 290 M318 280 L342 245 M342 280 L318 245"/>
    <line x1="270" y1="235" x2="390" y2="235" stroke-width="4"/>
    <line x1="282" y1="220" x2="282" y2="250"/><line x1="310" y1="215" x2="310" y2="255"/>
    <line x1="350" y1="215" x2="350" y2="255"/><line x1="378" y1="222" x2="378" y2="248"/>
  </g>
  <circle cx="330" cy="205" r="6" fill="#ff4d4d"/><circle cx="330" cy="205" r="14" fill="#ff4d4d" opacity=".3"/>
  <!-- ondas de rádio -->
  <g fill="none" stroke="#ffe7a3" stroke-width="3" stroke-linecap="round">
    <path d="M290 165 A55 55 0 0 1 370 165" opacity=".8"/>
    <path d="M262 135 A95 95 0 0 1 398 135" opacity=".55"/>
    <path d="M234 105 A135 135 0 0 1 426 105" opacity=".32"/>
  </g>

  </g>

  <!-- estrada -->
  <path d="M760 640 C800 590 900 570 980 555 C1060 540 1140 530 1240 520 L1262 522 C1170 535 1090 548 1015 566 C930 588 880 610 860 640Z" fill="url(#road)"/>
  <path d="M812 640 C850 600 930 582 1000 566 C1070 550 1150 538 1250 521" fill="none" stroke="#ffc857" stroke-width="2" stroke-dasharray="14 12" opacity=".6"/>

  <!-- 4x4 com antena -->
  <g transform="translate(960 515)" fill="#1a0e1c">
    <path d="M0 30 L6 14 L22 12 L34 0 L76 0 L86 14 L104 16 L108 30Z"/>
    <rect x="30" y="-6" width="52" height="5" rx="2"/>
    <circle cx="24" cy="32" r="10"/><circle cx="86" cy="32" r="10"/>
    <circle cx="24" cy="32" r="4" fill="#5a2f5e"/><circle cx="86" cy="32" r="4" fill="#5a2f5e"/>
    <line x1="96" y1="16" x2="104" y2="-30" stroke="#1a0e1c" stroke-width="2"/>
    <circle cx="2" cy="22" r="3" fill="#ffd27a"/>
  </g>

  <!-- primeiro plano -->
  <path d="M0 580 C220 545 420 560 600 580 C700 590 740 610 760 640 H0Z" fill="#24121f"/>
  <path d="M1000 640 C1100 590 1280 565 1440 570 C1520 572 1570 580 1600 585 V640Z" fill="#24121f"/>

  <!-- barraca e fogueira -->
