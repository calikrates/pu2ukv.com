  <g fill="#1a0e1c">
    <path d="M60 590 L80 520 L100 590Z"/><path d="M95 595 L120 505 L145 595Z"/>
    <path d="M520 585 L538 525 L556 585Z"/><path d="M1530 592 L1550 520 L1570 592Z"/>
