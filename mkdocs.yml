site_name: PU2UKV
site_description: Caderneta de campo — radioamadorismo, overland e camping
site_url: https://pu2ukv.com/
copyright: 73 de PU2UKV

theme:
  name: material
  language: pt-BR
  logo: assets/brasao-icone.svg
  favicon: assets/brasao-icone.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo escuro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Início: index.md
  - Radioamador:
      - Código Q: radioamador/codigo-q.md
      - Alfabeto fonético e Morse: radioamador/alfabeto-fonetico.md
      - Repetidoras da região: radioamador/repetidoras.md
      - Programar o HT: radioamador/programar-ht.md
      - Consulta de indicativos: radioamador/indicativos.md
  - Overland:
      - Roteiros:
          - overland/roteiros/index.md
          - Trilha da Placa · Cajamar: overland/roteiros/trilha-da-placa.md
          - Pedra Grande · Atibaia: overland/roteiros/pedra-grande.md
          - Pico do Jaraguá · São Paulo: overland/roteiros/pico-do-jaragua.md
          - Castelhanos · Ilhabela: overland/roteiros/castelhanos.md
          - Serra do Rio do Rastro · SC: overland/roteiros/serra-do-rio-do-rastro.md
          - Serra do Corvo Branco · SC: overland/roteiros/serra-do-corvo-branco.md
      - Rádio em trilha: overland/radio-em-trilha.md
      - Checklist de viagem 4x4: overland/checklist-4x4.md
  - Camping:
      - Campings próximos: camping/campings.md
  - Sobre: sobre.md

hooks:
  - hooks/repetidoras.py
  - hooks/campings.py
  - hooks/indicativos.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
